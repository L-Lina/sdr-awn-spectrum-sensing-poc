<text x="145" y="304" class="head" text-anchor="middle" fill="#C62828"><tspan x="145" dy="0">RF attacker (A1)</tspan></text>
<text x="50" y="333" class="small" text-anchor="start"><tspan x="50" dy="0">Independent SDR</tspan><tspan x="50" dy="19">Additive waveform a[n]</tspan><tspan x="50" dy="19">Controls power, bandwidth,</tspan><tspan x="50" dy="19">timing, waveform, duty cycle</tspan><tspan x="50" dy="19">No host access</tspan><tspan x="50" dy="19">No precise phase synchronization</tspan></text>
