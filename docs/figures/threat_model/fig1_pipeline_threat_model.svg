<text x="145" y="172" class="head" text-anchor="middle"><tspan x="145" dy="0">Legitimate transmitter</tspan></text>
<text x="145" y="195" class="small" text-anchor="middle"><tspan x="145" dy="0">burst waveform s[n]</tspan></text>
