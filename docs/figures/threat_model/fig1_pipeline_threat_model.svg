<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">End-to-end RF threat model</title>
<desc id="desc">A practical additive RF attacker crosses the trust boundary into an energy-triggered AMC pipeline.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 z" fill="#1f2937"/>
  </marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 z" fill="#C62828"/>
  </marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#fff5ef"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#D55E00" stroke-width="2"/>
  </pattern>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #667085; }
    .section { font-size: 14px; font-weight: 700; letter-spacing: .7px; }
    .head { font-size: 14px; font-weight: 700; }
    .body { font-size: 12px; }
    .small { font-size: 10.5px; }
    .tiny { font-size: 9px; }
    .italic { font-style: italic; }
  </style>
</defs>
<rect x="0" y="0" width="1400" height="760" fill="white"/>
<text x="50" y="44" class="title" text-anchor="start"><tspan x="50" dy="0">Threat Model: Energy-Triggered AMC Monitoring</tspan></text>
<text x="50" y="68" class="subtitle" text-anchor="start"><tspan x="50" dy="0">Current scope: one pre-channelized complex-baseband channel; no implemented wideband occupancy inference</tspan></text>
<text x="30" y="108" class="section" text-anchor="start"><tspan x="30" dy="0">UNTRUSTED RF</tspan><tspan x="30" dy="18">ENVIRONMENT</tspan></text>
<rect x="300" y="90" width="1070" height="610" rx="14" fill="#ffffff" stroke="#1f2937" stroke-width="2" stroke-dasharray="9 6"/>
<rect x="355" y="79" width="390" height="24" fill="white"/>
<text x="365" y="97" class="section" text-anchor="start"><tspan x="365" dy="0">DEFENDER-CONTROLLED MONITORING NODE</tspan></text>
